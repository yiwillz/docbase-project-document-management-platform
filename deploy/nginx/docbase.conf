# docbase 的 Nginx 配置示例（客户 IT 习惯用 Nginx 时代替 Caddy；Linux / Windows 都适用）
# 证书用客户自己的 CA 签发的，或自签的；把下面的路径和地址改成实际的。

server {
    listen 80;
    server_name docbase.example.local;          # 改成实际地址（IP 或名字）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name docbase.example.local;

    ssl_certificate     /etc/nginx/certs/docbase.crt;   # 证书（含中间证书）
    ssl_certificate_key /etc/nginx/certs/docbase.key;   # 私钥
    ssl_protocols TLSv1.2 TLSv1.3;

    # 上传：单个文件最大 2 GB，留些余量；不在 Nginx 里缓存整个上传（边收边转给后端）
    client_max_body_size 3g;
    proxy_request_buffering off;

    # 大文件下载、生成报表可能较慢
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8000;          # docbase 后端只在本机监听
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # 后端据此给登录 cookie 加 Secure
        proxy_buffering off;
    }

    access_log /var/log/nginx/docbase-access.log;
    error_log  /var/log/nginx/docbase-error.log;
}
